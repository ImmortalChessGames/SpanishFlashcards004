<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish to English Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .translator-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #333;
            margin-top: 0;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #155cb4;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f3f4;
            border-left: 5px solid #1a73e8;
            border-radius: 4px;
            min-height: 40px;
            font-size: 16px;
            color: #202124;
            white-space: pre-wrap;
        }
        .error {
            border-left-color: #d93025;
            color: #d93025;
            background-color: #fce8e6;
        }
    </style>
</head>
<body>

<div class="translator-container">
    <h2>Spanish to English</h2>
    
    <label for="spanishText"><strong>Enter Spanish text:</strong></label>
    <textarea id="spanishText" placeholder="Escribe algo aquí... (e.g., Hola, ¿cómo estás?)"></textarea>
    
    <button onclick="translateText()">Translate</button>
    
    <strong>Translation:</strong>
    <div id="outputResult" class="result-box">Your English translation will appear here...</div>
</div>

<script>
async function translateText() {
    const text = document.getElementById('spanishText').value.trim();
    const outputDiv = document.getElementById('outputResult');
    
    if (!text) {
        outputDiv.innerHTML = "Please enter some text to translate.";
        outputDiv.classList.remove('error');
        return;
    }

    outputDiv.innerHTML = "Translating...";
    outputDiv.classList.remove('error');

    // Uses Google's public translation client engine endpoint
    const url = `https://googleapis.com{encodeURIComponent(text)}`;

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Translation request failed.");
        
        const data = await response.json();
        
        // Google returns multi-dimensional arrays for chunks of text. 
        // We map and join them to handle multi-line inputs properly.
        const translation = data[0].map(item => item[0]).join('');
        
        outputDiv.innerText = translation;
    } catch (error) {
        outputDiv.innerText = "Error: Could not fetch translation. Please check your network connection.";
        outputDiv.classList.add('error');
    }
}
</script>

</body>
</html>
