<script>
    const DEFAULT_LOCAL_STORAGE_KEY = '___spanish_vocab___';
    const DEFAULT_LOCAL_STORAGE_STORIES_KEY = '___spanish_v_stories___';
    const ITEMS_PER_PAGE = 20;
    const MASTERY_STREAK_NEEDED = 4;
    const QUESTIONS_PER_QUIZ = 30;

    let currentPage = 1;
    let filteredList = []; // Holds items after search filter is applied

    const wordForm = document.getElementById('wordForm');
    const wordList = document.getElementById('wordList');
    const searchBar = document.getElementById('searchBar');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const pageInfo = document.getElementById('pageInfo');
    const googleTranslateAPIUrl = `https://www.googleapis.com/language/translate/v2`;

    const api1KeyEncrypted = 'WaMkBI+CSEivXQiGTg6hoEHhgC23MZ+zInz2AwJPYUQ5wLeTIGgvphRV9aU7NB7WtQ4WFrsVNCC1YY7BsqDQkXUhnPJPBSuPYSCb/GYAsHC9+bOPevpJAG8SCE6LSguglA==';
    const api2KeyEncrypted = 'WaMkBI+CSEivXQiGTg6hoECQ3+KCxELrOugTUzjgp1xJC2R3uwsQO3BDhcgSRJeRjGHt09acwERw3bPJb51v+weimFm9vvkysfpA4/Wk5xkxgNE=';
    const api3KeyEncrypted = 'WaMkBI+CSEivXQiGTg6hoBl3w4dnl5l1/a+xjpVKCrXxul2ROtEcogoGEktfZUDEJwvjmuhCJVrVvfzC7cipF6msKIC/NluiNzZWtqGYWJeEE8hsXhZWE5w9UiLIsfvq3Q==';
    const salt = new Uint8Array([89, 163, 36, 4, 143, 130, 72, 72, 175, 93, 8, 134, 78, 14, 161, 160]);
    let quizVocab = [];

    // Global variable to keep track of our countdown timer instance
    let msgCenterTimeoutId = null;

    // 1. TOP LEVEL: Voice management and loading
    let currentVoice = null;

    // 2. DOM Elements
    const rateSlider = document.getElementById('rate-slider');
    const rateValueDisplay = document.getElementById('rate-value');
    const speakBtn = document.getElementById('speak-btn');

    let quizData = [];
    let currentQuestionIndex = -1;
    let score = 0;

    function generateQuizWords() {
      try {
        currentQuestionIndex = -1;
        const allWords = masterData;
        if (!Array.isArray(allWords) || allWords.length === 0) return [];

        // Shuffle the array elements randomly
        const shuffled = [...allWords].sort(() => 0.5 - Math.random());

        // Slice out exactly 30 words from the shuffled list

        const quizWords = shuffled.slice(0, QUESTIONS_PER_QUIZ);

        const quizQuestionCount = document.getElementById('quiz-question-count');
        if(quizQuestionCount) {
            quizQuestionCount.innerText = 'There are a total of ' + quizWords.length + ' questions';
        }

        return quizWords;
      } catch (error) {
        console.error("Error generating quiz:", error);
        return [];
      }
    }

    // 1. GLOBAL SETTINGS & KEYS
    const PROGRESS_KEY = 'quiz_x_progress';
    let masterData = [];          // Holds original raw vocabulary database
    let currentQuestionObj = null; // Holds the active question configuration
    let isProcessingAnswer = false; // Prevents double-clicking choices during feedback animation

    // 2. LOCAL STORAGE MANAGEMENT & PROGRESS TRACKING
    function getAllProgress() {
        return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
    }

    function recordUserAnswer(spanishWord, isCorrect) {
        const progress = getAllProgress();
        
        if (!progress[spanishWord]) {
            progress[spanishWord] = { cs: 0, tw: 0 };
        }

        if (isCorrect) {
            progress[spanishWord].cs += 1;
        } else {
            progress[spanishWord].cs = 0; // Reset streak instantly on wrong answer
            progress[spanishWord].tw += 1;
        }

        localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));

        return progress[spanishWord].cs; // Return updated streak for immediate rendering
    }

    // THE RESET FUNCTION: Clears metrics and forces a layout refresh
    function resetQuizProgress() {
        //if (confirm("Are you sure you want to reset all tracking progress? This will put all mastered words back into rotation.")) {
        //    localStorage.removeItem(PROGRESS_KEY);
        //    isProcessingAnswer = false;
            score = 0;
            currentQuestionIndex = -1;
            scoreBox.classList.add("hidden");
            quizBox.classList.remove("hidden");
            quizVocab = generateQuizWords();
            loadNextQuestion(); 
        //}
    }

    // totalStreak = ts
    // totalIncorrect = tw

    // 3. WEIGHTED SELECTION LOGIC
    function getWordWeight(streak, tw, level) {
        let weight = 1.0; 

        switch(level) {
            case 'easy':
                weight = 1.0 + (tw * 3.0) - (streak * 0.3);
                break;
            case 'intermediate':
                weight = 1.0 + (tw * 1.5) - (streak * 0.2);
                break;
            case 'advanced':
                weight = 1.0 + (streak * 1.5) - (tw * 0.5);
                break;
            case 'random':
            default:
                weight = 1.0;
                break;
        }

        return Math.max(0.1, weight);
    }

    function pickNextSpanishWord(data, level = 'random') {
        const progress = getAllProgress();

        // Remove any word that has achieved 3 consecutive correct streaks
        const availableWords = data.filter(item => {
            const itemProgress = progress[item.spanish];
            return !(itemProgress && itemProgress.cs >= MASTERY_STREAK_NEEDED);
        });

        if (availableWords.length === 0) return null; // Win state reached

        let totalWeight = 0;
        const weightedItems = availableWords.map(item => {
            const itemProgress = progress[item.spanish] || { cs: 0, tw: 0 };
            const weight = getWordWeight(itemProgress.cs, itemProgress.tw, level);
            totalWeight += weight;
            return { item, weight };
        });

        let randomRoll = Math.random() * totalWeight;
        for (const entry of weightedItems) {
            randomRoll -= entry.weight;
            if (randomRoll <= 0) {
                return entry.item;
            }
        }
        return weightedItems[weightedItems.length - 1].item;
    }


    // 4. MULTIPLE CHOICE QUESTION GENERATOR (SINGLE ITEM)
    function generateSingleQuestion(selectedWordItem, fullData, numChoices = 4) {
        const correctAnswer = parseAndGetFirst(selectedWordItem.english);
        
        const distractors = fullData
            .filter((obj) => parseAndGetFirst(obj.english) !== correctAnswer)
            .map((obj) => parseAndGetFirst(obj.english));
 
        const shuffledDistractors = shuffleArray([...distractors]).slice(0, numChoices - 1);
        const allChoices = shuffleArray([...shuffledDistractors, correctAnswer]);

        return {
            spanishWord: selectedWordItem.spanish,
            question: `${selectedWordItem.spanish}`,
            choices: allChoices,
            answer: correctAnswer
        };
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }


    // 5. GAME ENGINE CONTROL LOOP & UI DOM RENDERER
    function loadNextQuestion() {

        if(quizVocab.length<1) {
            return;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex >= quizVocab.length) {
          endQuiz(score, quizVocab.length);
          return; // Stop the execution of this function
        }

        isProcessingAnswer = false; 

        const levelSelector = document.getElementById('level-select');
        const chosenLevel = levelSelector ? levelSelector.value : 'random'; 

        const nextWordItem = pickNextSpanishWord(masterData, chosenLevel);

        if (!nextWordItem) {
            document.getElementById('question').innerText = "🎉 ¡Felicidades!";
            document.getElementById('choices-container').innerHTML = "";
            document.getElementById('streak-counter').innerHTML = "";
            document.getElementById('quiz-question-count').innerText = "Mastered all words!";
            return;
        }

        currentQuestionObj = generateSingleQuestion(nextWordItem, masterData);

        const progress = getAllProgress();
        const remainingCount = masterData.filter(item => !(progress[item.spanish]?.cs >= MASTERY_STREAK_NEEDED)).length;
        
        const quizQuestionCount = document.getElementById('quiz-question-count');
        if (quizQuestionCount) {
            quizQuestionCount.innerText = `Words left to master: ${remainingCount} (Out of ${masterData.length})`;
        }

        document.getElementById('quiz-progress-counter').textContent=(currentQuestionIndex+1);
        document.getElementById('quiz-progress-total').textContent=(quizVocab.length);


        renderQuestionToUI(currentQuestionObj);
    }

    function endQuiz(score, totalQuestions) {
      showDynamicPopup('Quiz Completed','You completed the quiz with the score of ' + score + ' out of '+ totalQuestions +'.', 5000);
      resetQuizProgress();
    }

    function renderQuestionToUI(questionObj) {
        document.getElementById('question').innerText = questionObj.question;

        // Build the beautiful visual streak tracker component
        const progress = getAllProgress();
        const currentWordProgress = progress[questionObj.spanishWord] || { cs: 0 };
        const currentStreak = currentWordProgress.cs;

        const streakContainer = document.getElementById('streak-counter');
        if (streakContainer) {
            streakContainer.className = "streak-container";
            let streakHTML = `<span></span>`;
            for (let i = 1; i <= MASTERY_STREAK_NEEDED; i++) {
                if (i <= currentStreak) {
                    streakHTML += `<span class="streak-dot active">🔥</span>`;
                } else {
                    streakHTML += `<span class="streak-dot" style="opacity: 0.25;">⭕</span>`;
                }
            }
            streakContainer.innerHTML = streakHTML;
        }

        // Populate buttons cleanly
        const container = document.getElementById('choices-container');
        container.innerHTML = ''; 

        questionObj.choices.forEach(choiceText => {
            const btn = document.createElement('button');
            btn.className = 'quiz-btn'; 
            btn.innerText = choiceText;
            
            // Inline override style to cancel standard text visibility delay transitions if needed
            btn.style.opacity = "1"; 
            btn.style.animation = "none";

            btn.addEventListener('click', (e) => handleAnswerSubmit(choiceText, e.target));
            container.appendChild(btn);
        });
    }

    // 6. IN-LINE ANIMATION FEEDBACK CONTROLLER
    function handleAnswerSubmit(userSelectedAnswer, clickedButtonElement) {
        if (isProcessingAnswer || !currentQuestionObj) return;
        isProcessingAnswer = true; // Lock choice buttons immediately during validation phase

        console.log('quiz_word_progress:' + localStorage.getItem(PROGRESS_KEY));

        const isCorrect = (userSelectedAnswer === currentQuestionObj.answer);
        
        if(isCorrect) {
            score++;
        }

        // Disable all option choices concurrently to block additional input registrations
        const allButtons = document.querySelectorAll('#choices-container .quiz-btn');
        allButtons.forEach(btn => btn.disabled = true);

        // Apply native CSS visual design feedback classes
        if (isCorrect) {
            clickedButtonElement.classList.add('correct-choice');
        } else {
            clickedButtonElement.classList.add('incorrect-choice');
            
            // Highlight the correct answer option implicitly so user learns from error
            allButtons.forEach(btn => {
                if (btn.innerText === currentQuestionObj.answer) {
                    btn.classList.add('correct-choice');
                }
            });
        }

        // Save tracking results and capture streak change context
        const updatedStreak = recordUserAnswer(currentQuestionObj.spanishWord, isCorrect);

        // Update streak indicators inside the view layout container instantly
        const streakDots = document.querySelectorAll('.streak-dot');
        if (isCorrect) {
            if (streakDots[updatedStreak - 1]) {
                streakDots[updatedStreak - 1].innerHTML = "🔥";
                streakDots[updatedStreak - 1].style.opacity = "1";
                streakDots[updatedStreak - 1].classList.add('active');
            }
        } else {
            // Flash streak loss immediately on failure back to placeholder styles
            streakDots.forEach(dot => {
                dot.innerHTML = "⭕";
                dot.style.opacity = "0.25";
                dot.classList.remove('active');
            });
        }

        // Gracefully wait 1.2 seconds for layout animation sequence execution before auto-advancing
        setTimeout(() => {
            loadNextQuestion();
        }, isCorrect ? 1000 : 3500);
    }

    // 7. INITIALIZATION HOOK
    function initQuizApplication(vocabularyDatabase) {
        masterData = vocabularyDatabase;
        
        const restartBtn = document.getElementById('restart-btn');
        if (restartBtn) {
            restartBtn.addEventListener('click', resetQuizProgress);
        }
        quizVocab = generateQuizWords();
        loadNextQuestion();
    }

    async function getDerivedKey() {
        const secret = document.getElementById('sm-secret').value;
        if(!secret || secret==='enter-your-secret-passcode-here') {
          alert("Please replace 'enter-your-secret-passcode-here' in Settings with a valid secret pass code.");
          return;
        }
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
            "raw", encoder.encode(secret), "PBKDF2", false, ["deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function decrypt(encrypted) {
        try {
            const combined = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);
            const key = await getDerivedKey(salt);
            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv }, key, data
            );
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            showDynamicPopup('Error','Password is wrong.', 3000);
            console.log('Decryption failed. Incorrect password or broken text.');
        }
        return null;
    }

    function getRandomSubset(arr, maxReturn = 30) {
      if (!Array.isArray(arr)) return [];
      const targetLength = arr.length>=maxReturn ? maxReturn : arr.length;
      const shuffled = [...arr];
      for (let i = 0; i < targetLength; i++) {
        const randomIdx = i + Math.floor(Math.random() * (shuffled.length - i));
        [shuffled[i], shuffled[randomIdx]] = [shuffled[randomIdx], shuffled[i]];
      }
      return shuffled.slice(0, targetLength);
    }

    function removeWordFromStorage(storageKey, wordToRemove) {
      try {
        // 1. Fetch the existing stringified data
        const existingData = localStorage.getItem(storageKey);
        
        // 2. If nothing exists, there is nothing to delete
        if (!existingData) return;

        // 3. Parse the data back into a JavaScript object
        const wordsObject = JSON.parse(existingData);

        // 4. Double check that the data is a valid object (and not null or an array)
        if (wordsObject && typeof wordsObject === 'object' && !Array.isArray(wordsObject)) {
          
          // 5. Check if the word exists in the object before trying to delete it
          if (wordToRemove in wordsObject) {
            // Delete the key and its nested metadata object (e.g., {"cs":5, "tw":0})
            delete wordsObject[wordToRemove];
            
            // 6. Save the cleaned object back to localStorage
            localStorage.setItem(storageKey, JSON.stringify(wordsObject));
          }
        }

        resetQuizProgress();
        updateDisplayData();
      } catch (error) {
        console.error("Error updating localStorage:", error);
      }
    }

function adaptGoogleToITranslate(googleResponse, targetLang) {
    var googleList = (googleResponse && googleResponse.data && googleResponse.data.translations) || [];
    
    // Extract the detected source language from the first item
    var firstItem = googleList[0] || {};
    var detectedSource = firstItem.detectedSourceLanguage || "en";
    
    // Map individual translations into iTranslate's format
    var convertedTranslations = googleList.map(function(item) {
        return {
            translation: item.translatedText || ""
        };
    });
    
    // Construct the payload with responseData and body nested at the top levels
    var innerPayload = {
        source: detectedSource,
        target: targetLang || "es", 
        translations: convertedTranslations
    };

    return {
        responseData: innerPayload,
        body: innerPayload
    };
}

function parseAndDisplayUnique(textValue, data, visualContainer) {
    // 1. Initialize an array to keep items in their natural sequence
    const orderedResults = [];

    // 2. Safely capture the main target translation string first
    if (data.target && data.target.text) {
        orderedResults.push(data.target.text.toLowerCase().trim());
    }

    // 3. Traverse down to gather nested meaning text instances in natural order
    if (data.target && data.target.meanings && Array.isArray(data.target.meanings)) {
        data.target.meanings.forEach(meaning => {
            if (meaning.entries && Array.isArray(meaning.entries)) {
                meaning.entries.forEach(entry => {
                    if (entry.text) {
                        orderedResults.push(entry.text.trim().toLowerCase());
                    }
                });
            }
        });
    }

    // 4. Run the final data array through a Set structure to remove duplicates
    const uniqueResults = [...new Set(orderedResults)];

    // 5. Build clean layout tree lists 
    if (uniqueResults.length === 0) {
        visualContainer.innerHTML = "<p style='color:#718096;'>No translations were found in the response object.</p>";
        return;
    }

    let oneLineTranslation = '';
    let listHtml = "<ol class='translation-list'>";
    listHtml += "<li>" + textValue + "&nbsp;<a class='pressed-link' href='#' onclick='clickSaveWord(event);'>[Save]</li>";
    uniqueResults.slice(0,5).forEach((word) => {

        if(word.endsWith('.')) {
            word = word.substring(0,word.length-1);
        }

        listHtml += "<li>" + word + "</li>";
        oneLineTranslation += (word + "; ");
    });
    if(oneLineTranslation.length>0 && oneLineTranslation.endsWith("; ")) {
        oneLineTranslation = oneLineTranslation.trim().substring(0,oneLineTranslation.trim().length-1);
    }
    listHtml += "</ol>";

    document.getElementById('spanishWord').value=textValue;
    document.getElementById('englishTranslation').value=oneLineTranslation;

    visualContainer.innerHTML = listHtml;
}

    const wordBox = document.getElementById('wordBox');

    // Clear previous results
    wordBox.innerHTML = '';

    if (input === '') {
        alert('Por favor, ingresa una frase primero.');
        return;
    }

    // Split by spaces to find raw components
    const rawWords = input.split(/\s+/);

    rawWords.forEach(rawWord => {
        // Extract punctuation from the clean word using a Spanish-friendly regex
        // This preserves accents (á, é, í, ó, ú), umlauts (ü), and the ñ
        const cleanWordMatch = rawWord.match(/[0-9A-Za-zÁÉÍÓÚáéíóúÜüÑñ]+/);
        
        if (cleanWordMatch) {
            const cleanWord = cleanWordMatch[0];
            
            // Create a span element for the clickable word
            const span = document.createElement('span');
            span.className = 'clickable-word';
            span.textContent = rawWord; // Displays the word with its surrounding punctuation
            
            // Add click event that alerts only the cleaned word
            span.addEventListener('click', () => {
                sendTranslationRequest(cleanWord);
                //translateText(cleanWord);
            });

            wordBox.appendChild(span);
        }
    });
}

    // Grab all tab buttons and all content panels
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        tabButtons.forEach(btn => btn.classList.remove('active'));
        tabPanels.forEach(panel => panel.classList.remove('active'));

        button.classList.add('active');
        const targetPanel = document.querySelector(button.getAttribute('data-target'));
        targetPanel.classList.add('active'); // This triggers 'display: block' safely from your CSS file
      });
    });


    let toastTimeout;

    function showToast() {
      const toast = document.getElementById('cartToast');
      
      // Clear any existing timeout if they click rapidly
      clearTimeout(toastTimeout);
      
      // Show the toast
      toast.classList.add('show');
      
      // Automatically hide it after 3 seconds
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1000);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateQuiz(data, numChoices = 4) {
        const quizQuestionCount = document.getElementById('quiz-question-count');
        quizQuestionCount.innerText = 'There are a total of ' + data.length + ' questions';
      return data.map((item) => {
        const correctAnswer = item.english;
        const distractors = data
          .filter((obj) => obj.english !== correctAnswer)
          .map((obj) => obj.english);
        
        const shuffledDistractors = shuffleArray([...distractors]).slice(0, numChoices - 1);
        const allChoices = shuffleArray([...shuffledDistractors, correctAnswer]);

        return {
          spanishWord: item.spanish,
          question: `${item.spanish}`,
          choices: allChoices,
          answer: correctAnswer
        };
      });
    }

    const quizBox = document.getElementById("quiz-box");
    const scoreBox = document.getElementById("score-box");
    const questionEl = document.getElementById("question");
    const choicesContainer = document.getElementById("choices-container");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");

    function handleAnswer(selectedButton, selectedChoice) {
      const currentQuizItem = quizData[currentQuestionIndex];
      const allButtons = choicesContainer.querySelectorAll("button");
      // Disable all buttons immediately to block double clicking
      allButtons.forEach(btn => btn.disabled = true);

      let pauseMillis = 1000;

      if (selectedChoice === currentQuizItem.answer) {
        score++;
        selectedButton.classList.add("correct-choice");
      } else {
        pauseMillis = 5000;
        selectedButton.classList.add("incorrect-choice");
        
        // Find and highlight the correct button so the user learns from their mistake
        allButtons.forEach(btn => {
            if (btn.dataset.choiceValue === currentQuizItem.answer) {
                btn.classList.add("correct-choice");
            }
        });
      }

      currentQuestionIndex++;

      // Pause for 1.2 seconds so user can process the animations/feedback
      setTimeout(() => {
          if (currentQuestionIndex < quizData.length) {
            loadNextQuestion();
          } else {
            showResults();
          }
      }, pauseMillis);
    }

    function showResults() {
      quizBox.classList.add("hidden");
      scoreBox.classList.remove("hidden");
      finalScoreEl.innerText = `You scored ${score} out of ${quizData.length}!`;
    }

    // Scoped helper to update status message
    function smShowStatus(message, isError = false) {

        statusDiv.style.color = isError ? 'var(--sm-error-color)' : 'var(--sm-text-muted)';
    }

    // Export the selected LocalStorage array as a pretty-printed JSON file
    function smExportLocalStorage() {
        const storageNameInput = document.getElementById('sm-storageName');
        const storageName = storageNameInput ? storageNameInput.value.trim() : '';

        if (!storageName) {
            smShowStatus('Error: Please enter a Local Storage Name.', true);
            return;
        }

        const data = localStorage.getItem(storageName);

        if (!data) {
            smShowStatus(`Error: No data found in Local Storage for "${storageName}".`, true);
            return;
        }

        let outputData = data;

        try {
            const parsed = JSON.parse(data);
            
            // Enforce that the exported root is wrapped as an array if it isn't already
            const arrayData = Array.isArray(parsed) ? parsed : [parsed];
            outputData = JSON.stringify(arrayData, null, 2); 
        } catch (e) {
            console.warn('Data is not valid JSON. Exporting raw fallback.');
            // If data is just raw text, wrap it into a valid JSON array format
            outputData = JSON.stringify([data], null, 2);
        }

        const blob = new Blob([outputData], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${storageName}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        smShowStatus(`Successfully exported "${storageName}.json" as Pretty Array!`);
    }

    // Load, merge arrays, and remove duplicates
    function smImportLocalStorage(event) {
        const storageNameInput = document.getElementById('sm-storageName');
        const storageName = storageNameInput ? storageNameInput.value.trim() : '';
        const files = event.target.files;

        if (!storageName) {
            smShowStatus('Error: Please enter a Local Storage Name before importing.', true);
            event.target.value = '';
            return;
        }

        if (!files || files.length === 0) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);

                // Enforce that the imported root must be a JSON array
                if (!Array.isArray(importedData)) {
                    throw new Error('Root element of imported JSON must be an Array.');
                }

                let existingData = [];
                const rawExisting = localStorage.getItem(storageName);
                
                if (rawExisting) {
                    try {
                        const parsedExisting = JSON.parse(rawExisting);
                        existingData = Array.isArray(parsedExisting) ? parsedExisting : [parsedExisting];
                    } catch (parseError) {
                        console.warn('Existing data was not valid JSON array, resetting storage.');
                        existingData = [];
                    }
                }

                // Merge the two arrays together
                const combinedData = [...existingData, ...importedData];

                // Remove exact duplicates by filtering with a Set of stringified items
                const seenItems = new Set();
                const uniqueData = combinedData.filter(item => {
                    // Stringify ensures accurate identification regardless of object depth or primitive types
                    const stringifiedItem = JSON.stringify(item);
                    if (seenItems.has(stringifiedItem)) {
                        return false;
                    }
                    seenItems.add(stringifiedItem);
                    return true;
                });

                // Save clean deduplicated array back to local storage
                localStorage.setItem(storageName, JSON.stringify(uniqueData));
                smShowStatus(`Merged arrays! Saved ${uniqueData.length} unique items to "${storageName}".`);
            } catch (error) {
                smShowStatus(`Error importing file: ${error.message}`, true);
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsText(files[0]);
        updateDisplayData();
        window.location.reload();
    }

async function fetchGemmaResponse() {

    const key = await decrypt(api3KeyEncrypted);
    if(key) {
        showDynamicPopup('Generating article.','This may take 10+ minutes. If you get an error try again later.', 3000);
    } else {
        return;
    }
    const MODEL_NAME = document.getElementById('ai-engine').value;
    const API_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/models/'+MODEL_NAME+':generateContent?key='+key;
    document.getElementById('gsv-status').innerText='';
    const topicInput = document.getElementById('gsv-topic-input').value;
    let languageLevel = document.getElementById('ai-engine-lang-level').value;
    if(!languageLevel) {
        languageLevel = 'Intermediate-to-Advanced';
    }
    const systemInstruction = "You are an expert bilingual translation assistant. Your task is to write a short (15-20 sentence) summary of a historical event provided by the user. Generate the high-quality text in Spanish, but break it down completely into a sentence-by-sentence array. Do not output a separate full article. Output strictly a JSON array of objects, where each object contains a 'spanish' sentence and its direct 'english' translation.";
    const userPrompt = `Generate a short (15-20 sentence) summary of a historical event for the following topic broken down sentence-by-sentence into an array:\n\n[TOPIC]: ${topicInput}\n\nEnsure that you return a JSON array of objects where each sentence is modeled as an object with two properties: "spanish" with the spanish text of the sentence (trimmed with no whitespace before or after) and "english" with the english text (also trimmed with no whitespace before or after, and also remove any and all types of quotation characters from text prior to converting to JSON) of the sentence. Ensure the JSON is formatted using single quotes. Do not return full text. Please use ` + languageLevel + ` Spanish. Remove any all end of line \n or single quote or double quote characters from any text inside the resulting JSON.`;

    const payload = {
      contents: [{ parts: [{ text: userPrompt }] }],
      systemInstruction: { parts: [{ text: systemInstruction }] }
    };

    const maxRetries = 5;
    let currentDelay = 2000; // Start with a 2-second wait on failure

    for (let attempt = 1; attempt <= maxRetries; attempt++) {
        // 1. Set up the AbortController for the timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); 

        try {

            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal 
            });

            clearTimeout(timeoutId); 

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                showDynamicPopup('Error occurred.','Could not generate article due to : ' + errorData.error?.message + ', Status=' + response.status, 3000);
                throw new Error(errorData.error?.message || `HTTP Server error ${response.status}`);
            }

            const data = await response.json();
            if(data) {
                let responseText = data.candidates?.[0]?.content?.parts?.[1]?.text;
                if(!responseText) {
                    responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                }

                console.log(responseText);

                let responseObj = JSON.parse(responseText);
                responseText = JSON.stringify(responseObj, null, 2);    

                const topicMapKey = generateTopicMapKey(topicInput);
                const storiesMapJson = localStorage.getItem(DEFAULT_LOCAL_STORAGE_STORIES_KEY);
                let storiesMap;
                if(storiesMapJson && storiesMapJson.length>0) {
                    storiesMap = new Map(Object.entries(JSON.parse(storiesMapJson)));
                } else {
                    storiesMap = new Map();
                }

                if(storiesMap) {
                    storiesMap.set(topicMapKey, responseText);
                    const json = JSON.stringify(Object.fromEntries(storiesMap));
                    localStorage.setItem(DEFAULT_LOCAL_STORAGE_STORIES_KEY, json);
                }

                let newOptionName = generateTopicMapKey(topicInput);
                if(newOptionName.length > 50) {
                    newOptionName = newOptionName.substring(0,50);
                }   
                console.log('newOptionName='+newOptionName);
                const selectElt = document.getElementById("sm-chooseDataset");
                const newOptionKey = ">> "+newOptionName;
                selectElt.add(new Option(newOptionKey, responseText), 1);
                selectElt.value=responseText;                

                showDynamicPopup('Finished generating article.','Finished generating article for topic: ' + topicInput + '. See the dataset dropdown under the Settings tab.', 3000);
                document.getElementById('gsv-topic-input').value='';
                selectElt.dispatchEvent(new Event('change', { bubbles: true }));
                document.getElementsByClassName("tab-btn")[0].click();

                return responseText;
            }
        } catch (error) {
          clearTimeout(timeoutId); // Ensure timer cleans up on error

          const isTimeout = error.name === 'AbortError';
          const warnMsg = `Attempt ${attempt} failed. Reason: ${isTimeout ? 'Timeout (15s exceeded)' : error.message}`;
          console.warn(warnMsg);
          showDynamicPopup('Warning.', warnMsg, 1500);
          // If we used all retries, throw the final error up to your application
          if (attempt === maxRetries) {
            const errMsg = `Gemini API completely failed after ${maxRetries} attempts.`;
            showDynamicPopup('Error', errMsg, 1500);
            throw new Error(errMsg);
          } else {
              showDynamicPopup('Warning', warnMsg, 1500);
          }
          // Wait before trying again (2s, then 4s, etc.)
          console.log(`Waiting ${currentDelay / 1000}s before next attempt...`);
          await new Promise(resolve => setTimeout(resolve, currentDelay));
          currentDelay *= 2; 
        }
    }

    return null;
}

        });
    })();

document.addEventListener("DOMContentLoaded", () => {
  // Target only this specific namespace container
  const container = document.querySelector(".ui-acc-container");
  if (!container) return;

  const headers = container.querySelectorAll(".ui-acc-header");

  // Safely open the default active item inside this scope
  const defaultActive = container.querySelector(".ui-acc-item.ui-acc-active");
  if (defaultActive) {
    const defaultContent = defaultActive.querySelector(".ui-acc-content");
    defaultContent.style.maxHeight = defaultContent.scrollHeight + "px";
  }

  headers.forEach((header) => {
    header.addEventListener("click", function () {
      const currentItem = this.parentElement;
      const currentContent = currentItem.querySelector(".ui-acc-content");

      // Stop execution if the user clicks the active panel
      if (currentItem.classList.contains("ui-acc-active")) {
        return;
      }

      // Close other active items ONLY within this specific container instance
      const activeItem = container.querySelector(".ui-acc-item.ui-acc-active");
      if (activeItem) {
        activeItem.classList.remove("ui-acc-active");
        activeItem.querySelector(".ui-acc-content").style.maxHeight = "0";
      }

      // Open selected item
      currentItem.classList.add("ui-acc-active");
      currentContent.style.maxHeight = currentContent.scrollHeight + "px";
    });
  });
});


    turnFullArticleOffSpeaker();

    initQuizApplication(getVocabFromStorage());
    initFlashcards();
    resetQuizProgress();
    displayIncognitoWarning();
