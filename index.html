    function showDynamicPopup(titleText, bodyText, ms, emojiIcon = '🔔') {
      const root = document.getElementById("msg-center-scoped-root");
      const titleNode = document.getElementById("msg-center-dynamic-title");
      const textNode = document.getElementById("msg-center-dynamic-text");
      const iconNode = document.getElementById("msg-center-dynamic-icon");

      if (root && titleNode && textNode && iconNode) {
        // 1. Clear any active auto-close timer already running from a previous click
        if (msgCenterTimeoutId) {
          clearTimeout(msgCenterTimeoutId);
        }

        // 2. Inject the dynamic strings safely
        titleNode.innerText = titleText;
        textNode.innerText = bodyText;
        iconNode.innerText = emojiIcon;
        
        // 3. Make the window visible
        root.classList.add("msg-center-active");

        // 4. Schedule the auto-close functionality for exactly 3000 milliseconds
        msgCenterTimeoutId = setTimeout(() => {
          closeDynamicPopup();
        }, ms);
      }
    }

    function closeDynamicPopup() {
      const root = document.getElementById("msg-center-scoped-root");
      if (root) {
        root.classList.remove("msg-center-active");

    async function getDerivedKey() {
        const secret = document.getElementById('sm-secret').value;
        if(!secret || secret==='enter-your-secret-passcode-here') {
          alert("Please replace 'enter-your-secret-passcode-here' in Settings with a valid secret pass code.");
          return;
        }
        const encoder = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
            "raw", encoder.encode(secret), "PBKDF2", false, ["deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    async function decrypt(encrypted) {
        try {
            const combined = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);
            const key = await getDerivedKey(salt);
            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv }, key, data
            );
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            showDynamicPopup('Error','Password is wrong.', 3000);
            console.log('Decryption failed. Incorrect password or broken text.');
        }
        return null;
    }

    function getStorageKey() {
        const storageNameInput = document.getElementById('sm-storageName');
        const storageName = storageNameInput ? storageNameInput.value.trim() : '';
        if(storageName && storageName.length>0) {
            return storageName;
        } else {
            return DEFAULT_LOCAL_STORAGE_KEY;
        }
    }

    function parseAndGetFirst(str, delim = ';') {
      if (typeof str !== 'string') return '';
      
      // Split by semicolon and trim each item
      const items = str.split(';').map(item => item.trim());
      
      // Return the first item
      return items[0];
    }

    // 1. Retrieve items from localStorage
    function getVocabFromStorage() {
        const localData = localStorage.getItem(getStorageKey());
        if (!localData) return [];
        try {
            return JSON.parse(localData);
        } catch (e) {
            return [];
        }
    }

    // 2. Sort array alphabetically by Spanish word
    function sortAlphabetically(array) {
        return array.sort((a, b) => a.spanish.localeCompare(b.spanish, 'es', { sensitivity: 'base' }));
    }

    function getRandomSubset(arr, maxReturn = 30) {
      if (!Array.isArray(arr)) return [];
      const targetLength = arr.length>=maxReturn ? maxReturn : arr.length;
      const shuffled = [...arr];
      for (let i = 0; i < targetLength; i++) {
        const randomIdx = i + Math.floor(Math.random() * (shuffled.length - i));
        [shuffled[i], shuffled[randomIdx]] = [shuffled[randomIdx], shuffled[i]];
      }
      return shuffled.slice(0, targetLength);
    }

    // 3. Process data (Filter by search query, then paginate)
    function updateDisplayData() {
        quizVocab=[];
        const fullList = getVocabFromStorage();
        const searchQuery = searchBar.value.toLowerCase().trim();

        // Filter based on search input
        if (searchQuery) {
            filteredList = fullList.filter(item => 
                item.spanish.toLowerCase().includes(searchQuery) || 
                item.english.toLowerCase().includes(searchQuery)
            );
        } else {
            filteredList = fullList;
        }

        // Always keep the filtered results alphabetized
        sortAlphabetically(filteredList);
        // Determine total pages
        const totalItems = filteredList.length;
        const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

        // Adjust bounds for current page
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        // Paginate slice
        const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
        const endIndex = startIndex + ITEMS_PER_PAGE;
        const pageItems = filteredList.slice(startIndex, endIndex);

        // Render current page items
        wordList.innerHTML = '';
        if(pageItems) {
            if (pageItems.length === 0) {
                wordList.innerHTML = '<li style="color: #888; justify-content: center;">No words found</li>';
            } else {
                pageItems.forEach((item) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span><strong>${item.spanish}</strong> ➔ ${item.english}</span>
                        <button class="delete-btn" data-word="${item.spanish.replace(/"/g, '&quot;')}">Delete</button>
                    `;
                    wordList.appendChild(li);
                });
            }
        }

        if(filteredList) {
            if (filteredList.length === 0) {
                wordList.innerHTML = '<li style="color: #888; justify-content: center;">No words found</li>';
            } else {
                filteredList.forEach((item) => {
                    let quizItem = { spanish: item.spanish, english: parseAndGetFirst(item.english)};
                    quizVocab.push(quizItem);
                });
            }
        }
        quizVocab = getRandomSubset(quizVocab);

        // Update pagination buttons and text
        pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${totalItems} total entries)`;

        prevPageBtn.disabled = currentPage === 1;
        nextPageBtn.disabled = currentPage === totalPages || totalItems === 0;

        startQuiz();
    }

    function saveWord(spanishVal, englishVal) {
        if (spanishVal && englishVal) {
            let currentVocab = getVocabFromStorage();
            
            // Check if Spanish word already exists to avoid exact duplicates
            const exists = currentVocab.some(item => item.spanish.toLowerCase() === spanishVal.toLowerCase());
            if (exists) {
                return;
            }

            currentVocab.push({ spanish: spanishVal, english: englishVal });
            quizVocab.push({ spanish: spanishVal, english: parseAndGetFirst(englishVal) });
            localStorage.setItem(getStorageKey(), JSON.stringify(currentVocab));

            wordForm.reset();
            
            // Go to page 1 to let the user see where it fits alphabetically or search it
            currentPage = 1; 
            updateDisplayData();
        }
    }

    function deleteWord(wordToDelete) {
        let currentVocab = getVocabFromStorage();

        currentVocab = currentVocab.filter(item => item.spanish !== wordToDelete);
        quizVocab = quizVocab.filter(item => item.spanish !== wordToDelete);

        if (currentVocab.length > 0) {
            localStorage.setItem(getStorageKey(), JSON.stringify(currentVocab));
        } else {
            localStorage.removeItem(getStorageKey());
        }
    }

function adaptGoogleToITranslate(googleResponse, targetLang) {
    var googleList = (googleResponse && googleResponse.data && googleResponse.data.translations) || [];
    
    // Extract the detected source language from the first item
    var firstItem = googleList[0] || {};
    var detectedSource = firstItem.detectedSourceLanguage || "en";
    
    // Map individual translations into iTranslate's format
    var convertedTranslations = googleList.map(function(item) {
        return {
            translation: item.translatedText || ""
        };
    });
    
    // Construct the payload with responseData and body nested at the top levels
    var innerPayload = {
        source: detectedSource,
        target: targetLang || "es", 
        translations: convertedTranslations
    };

    return {
        responseData: innerPayload,
        body: innerPayload
    };
}

function parseAndDisplayUnique(textValue, data, visualContainer) {
    // 1. Initialize an array to keep items in their natural sequence
    const orderedResults = [];

    // 2. Safely capture the main target translation string first
    if (data.target && data.target.text) {
        orderedResults.push(data.target.text.toLowerCase().trim());
    }

    // 3. Traverse down to gather nested meaning text instances in natural order
    if (data.target && data.target.meanings && Array.isArray(data.target.meanings)) {
        data.target.meanings.forEach(meaning => {
            if (meaning.entries && Array.isArray(meaning.entries)) {
                meaning.entries.forEach(entry => {
                    if (entry.text) {
                        orderedResults.push(entry.text.trim().toLowerCase());
                    }
                });
            }
        });
    }

    // 4. Run the final data array through a Set structure to remove duplicates
    const uniqueResults = [...new Set(orderedResults)];

    // 5. Build clean layout tree lists 
    if (uniqueResults.length === 0) {
        visualContainer.innerHTML = "<p style='color:#718096;'>No translations were found in the response object.</p>";
        return;
    }

    let oneLineTranslation = '';
    let listHtml = "<ol class='translation-list'>";
    listHtml += "<li>" + textValue + "&nbsp;<a class='pressed-link' href='#' onclick='clickSaveWord(event);'>[Save]</li>";
    uniqueResults.slice(0,5).forEach((word) => {

        if(word.endsWith('.')) {
            word = word.substring(0,word.length-1);
        }

        listHtml += "<li>" + word + "</li>";
        oneLineTranslation += (word + "; ");
    });
    if(oneLineTranslation.length>0 && oneLineTranslation.endsWith("; ")) {
        oneLineTranslation = oneLineTranslation.trim().substring(0,oneLineTranslation.trim().length-1);
    }
    listHtml += "</ol>";

    document.getElementById('spanishWord').value=textValue;
    document.getElementById('englishTranslation').value=oneLineTranslation;

    visualContainer.innerHTML = listHtml;
}

function processSentence(input) {
    const wordBox = document.getElementById('wordBox');

    // Clear previous results
    wordBox.innerHTML = '';

    if (input === '') {
        alert('Por favor, ingresa una frase primero.');
        return;
    }

    // Split by spaces to find raw components
    const rawWords = input.split(/\s+/);

    rawWords.forEach(rawWord => {
        // Extract punctuation from the clean word using a Spanish-friendly regex
        // This preserves accents (á, é, í, ó, ú), umlauts (ü), and the ñ
        const cleanWordMatch = rawWord.match(/[0-9A-Za-zÁÉÍÓÚáéíóúÜüÑñ]+/);
        
        if (cleanWordMatch) {
            const cleanWord = cleanWordMatch[0];
            
            // Create a span element for the clickable word
            const span = document.createElement('span');
            span.className = 'clickable-word';
            span.textContent = rawWord; // Displays the word with its surrounding punctuation
            
            // Add click event that alerts only the cleaned word
            span.addEventListener('click', () => {
                sendTranslationRequest(cleanWord);
                //translateText(cleanWord);
            });

            wordBox.appendChild(span);
        }
    });
}

    // Grab all tab buttons and all content panels
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        tabButtons.forEach(btn => btn.classList.remove('active'));
        tabPanels.forEach(panel => panel.classList.remove('active'));

        button.classList.add('active');
        const targetPanel = document.querySelector(button.getAttribute('data-target'));
        targetPanel.classList.add('active'); // This triggers 'display: block' safely from your CSS file
      });
    });


    let toastTimeout;

    function showToast() {
      const toast = document.getElementById('cartToast');
      
      // Clear any existing timeout if they click rapidly
      clearTimeout(toastTimeout);
      
      // Show the toast
      toast.classList.add('show');
      
      // Automatically hide it after 3 seconds
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1000);
    }

    let quizData = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateQuiz(data, numChoices = 4) {
        const quizQuestionCount = document.getElementById('quiz-question-count');
        quizQuestionCount.innerText = 'There are a total of ' + data.length + ' questions';
      return data.map((item) => {
        const correctAnswer = item.english;
        const distractors = data
          .filter((obj) => obj.english !== correctAnswer)
          .map((obj) => obj.english);
        
        const shuffledDistractors = shuffleArray([...distractors]).slice(0, numChoices - 1);
        const allChoices = shuffleArray([...shuffledDistractors, correctAnswer]);

        return {
          spanishWord: item.spanish,
          question: `${item.spanish}`,
          choices: allChoices,
          answer: correctAnswer
        };
      });
    }

    const quizBox = document.getElementById("quiz-box");
    const scoreBox = document.getElementById("score-box");
    const questionEl = document.getElementById("question");
    const choicesContainer = document.getElementById("choices-container");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");

    function startQuiz() {
      score = 0;
      currentQuestionIndex = 0;
      quizVocab = quizVocab.filter((item, index, self) =>
        index === self.findIndex(t => t.spanish === item.spanish)
      );
      quizData = shuffleArray(generateQuiz(quizVocab, 4)); 
      scoreBox.classList.add("hidden");
      quizBox.classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      choicesContainer.innerHTML = "";
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.textContent = 'Permanently delete this word';
      deleteBtn.classList.add('delete-btn');
      deleteBtn.style='margin-bottom: 16px';
      deleteBtn.addEventListener('click', function() {
          const currentWord = quizData[currentQuestionIndex].question;
          const userConfirmed = confirm("Are you sure you want to permanently delete the word '" + currentWord + "'? ");
          if (!userConfirmed) {
            return;
          } else {
            deleteWord(currentWord);
            if (currentQuestionIndex < quizData.length) {
                score++;
                currentQuestionIndex++;
                showQuestion();            
            }
          }
      });
      choicesContainer.appendChild(deleteBtn);

      if(quizData && quizData.length>0) {

          const quizQuestionCount = document.getElementById('quiz-question-count');
          quizQuestionCount.innerText = 'Question ' + (currentQuestionIndex+1) + ' out of ' + quizData.length + '.';

          const currentQuizItem = quizData[currentQuestionIndex];
          questionEl.innerText = currentQuizItem.question;
          currentQuizItem.choices.forEach(choice => {
            const button = document.createElement("button");
            button.classList.add('quiz-btn');
            button.innerText = choice;
            // Store answer in a custom dataset property for easy identification later
            button.dataset.choiceValue = choice; 
            button.addEventListener("click", (e) => handleAnswer(e.target, choice));
            choicesContainer.appendChild(button);
          });
      }
    }

    function handleAnswer(selectedButton, selectedChoice) {
      const currentQuizItem = quizData[currentQuestionIndex];
      const allButtons = choicesContainer.querySelectorAll("button");
      
      // Disable all buttons immediately to block double clicking
      allButtons.forEach(btn => btn.disabled = true);

      let pauseMillis = 1000;

      if (selectedChoice === currentQuizItem.answer) {
        score++;
        selectedButton.classList.add("correct-choice");
      } else {
        pauseMillis = 5000;
        selectedButton.classList.add("incorrect-choice");
        
        // Find and highlight the correct button so the user learns from their mistake
        allButtons.forEach(btn => {
            if (btn.dataset.choiceValue === currentQuizItem.answer) {
                btn.classList.add("correct-choice");
            }
        });
      }

      currentQuestionIndex++;

      // Pause for 1.2 seconds so user can process the animations/feedback
      setTimeout(() => {
          if (currentQuestionIndex < quizData.length) {
            showQuestion();
          } else {
            showResults();
          }
      }, pauseMillis);
    }

    function showResults() {
      quizBox.classList.add("hidden");
      scoreBox.classList.remove("hidden");
      finalScoreEl.innerText = `You scored ${score} out of ${quizData.length}!`;
    }

    restartBtn.addEventListener("click", startQuiz);

    // Scoped helper to update status message
    function smShowStatus(message, isError = false) {
        const statusDiv = document.getElementById('sm-status');
        if (!statusDiv) return;
        statusDiv.textContent = message;
        statusDiv.style.color = isError ? 'var(--sm-error-color)' : 'var(--sm-text-muted)';
    }

    // Export the selected LocalStorage array as a pretty-printed JSON file
    function smExportLocalStorage() {
        const storageNameInput = document.getElementById('sm-storageName');
        const storageName = storageNameInput ? storageNameInput.value.trim() : '';

        if (!storageName) {
            smShowStatus('Error: Please enter a Local Storage Name.', true);
            return;
        }

        const data = localStorage.getItem(storageName);

        if (!data) {
            smShowStatus(`Error: No data found in Local Storage for "${storageName}".`, true);
            return;
        }

        let outputData = data;

        try {
            const parsed = JSON.parse(data);
            
            // Enforce that the exported root is wrapped as an array if it isn't already
            const arrayData = Array.isArray(parsed) ? parsed : [parsed];
            outputData = JSON.stringify(arrayData, null, 2); 
        } catch (e) {
            console.warn('Data is not valid JSON. Exporting raw fallback.');
            // If data is just raw text, wrap it into a valid JSON array format
            outputData = JSON.stringify([data], null, 2);
        }

        const blob = new Blob([outputData], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${storageName}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        smShowStatus(`Successfully exported "${storageName}.json" as Pretty Array!`);
    }

    // Load, merge arrays, and remove duplicates
    function smImportLocalStorage(event) {
        const storageNameInput = document.getElementById('sm-storageName');
        const storageName = storageNameInput ? storageNameInput.value.trim() : '';
        const files = event.target.files;

        if (!storageName) {
            smShowStatus('Error: Please enter a Local Storage Name before importing.', true);
            event.target.value = '';
            return;
        }

        if (!files || files.length === 0) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);

                // Enforce that the imported root must be a JSON array
                if (!Array.isArray(importedData)) {
                    throw new Error('Root element of imported JSON must be an Array.');
                }

                let existingData = [];
                const rawExisting = localStorage.getItem(storageName);
                
                if (rawExisting) {
                    try {
                        const parsedExisting = JSON.parse(rawExisting);
                        existingData = Array.isArray(parsedExisting) ? parsedExisting : [parsedExisting];
                    } catch (parseError) {
                        console.warn('Existing data was not valid JSON array, resetting storage.');
                        existingData = [];
                    }
                }

                // Merge the two arrays together
                const combinedData = [...existingData, ...importedData];

                // Remove exact duplicates by filtering with a Set of stringified items
                const seenItems = new Set();
                const uniqueData = combinedData.filter(item => {
                    // Stringify ensures accurate identification regardless of object depth or primitive types
                    const stringifiedItem = JSON.stringify(item);
                    if (seenItems.has(stringifiedItem)) {
                        return false;
                    }
                    seenItems.add(stringifiedItem);
                    return true;
                });

                // Save clean deduplicated array back to local storage
                localStorage.setItem(storageName, JSON.stringify(uniqueData));
                smShowStatus(`Merged arrays! Saved ${uniqueData.length} unique items to "${storageName}".`);
            } catch (error) {
                smShowStatus(`Error importing file: ${error.message}`, true);
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsText(files[0]);
        updateDisplayData();
        window.location.reload();
    }

    const topicInput = document.getElementById('gsv-topic-input').value;
    const systemInstruction = "You are an expert bilingual translation assistant. Your task is to write a short (15-20 sentence) summary of a historical event provided by the user. Generate the high-quality text in Spanish, but break it down completely into a sentence-by-sentence array. Do not output a separate full article. Output strictly a JSON array of objects, where each object contains a 'spanish' sentence and its direct 'english' translation.";
    const userPrompt = `Generate a short (15-20 sentence) summary of a historical event for the following topic broken down sentence-by-sentence into an array:\n\n[TOPIC]: ${topicInput}\n\nEnsure that you return a JSON array of objects where each sentence is modeled as an object with two properties: "spanish" with the spanish text of the sentence (trimmed with no whitespace before or after) and "english" with the english text (also trimmed with no whitespace before or after, and also remove any and all types of quotation characters from text prior to converting to JSON) of the sentence. Ensure the JSON is formatted using single quotes. Do not return full text. Please use intermediate or advanced Spanish. Remove any all end of line \n or single quote or double quote characters from any text inside the resulting JSON.`;

    const payload = {
      contents: [{ parts: [{ text: userPrompt }] }],
      systemInstruction: { parts: [{ text: systemInstruction }] }
    };

    const maxRetries = 5;
    let currentDelay = 2000; // Start with a 2-second wait on failure

    for (let attempt = 1; attempt <= maxRetries; attempt++) {
        // 1. Set up the AbortController for the timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); 

        try {

            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal 
            });

            clearTimeout(timeoutId); 

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                showDynamicPopup('Error occurred.','Could not generate article due to : ' + errorData.error?.message + ', Status=' + response.status, 3000);
                throw new Error(errorData.error?.message || `HTTP Server error ${response.status}`);
            }

            const data = await response.json();
            if(data) {
                let responseText = data.candidates?.[0]?.content?.parts?.[1]?.text;
                if(!responseText) {
                    responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                }

                console.log(responseText);

                let responseObj = JSON.parse(responseText);
                responseText = JSON.stringify(responseObj, null, 2);    

                const topicMapKey = generateTopicMapKey(topicInput);
                const storiesMapJson = localStorage.getItem(DEFAULT_LOCAL_STORAGE_STORIES_KEY);
                let storiesMap;
                if(storiesMapJson && storiesMapJson.length>0) {
                    storiesMap = new Map(Object.entries(JSON.parse(storiesMapJson)));
                } else {
                    storiesMap = new Map();
                }

                if(storiesMap) {
                    storiesMap.set(topicMapKey, responseText);
                    const json = JSON.stringify(Object.fromEntries(storiesMap));
                    localStorage.setItem(DEFAULT_LOCAL_STORAGE_STORIES_KEY, json);
                }

                let newOptionName = generateTopicMapKey(topicInput);
                if(newOptionName.length > 50) {
                    newOptionName = newOptionName.substring(0,50);
                }   
                console.log('newOptionName='+newOptionName);
                const selectElt = document.getElementById("sm-chooseDataset");
                const newOptionKey = ">> "+newOptionName;
                selectElt.add(new Option(newOptionKey, responseText), 1);
                selectElt.value=responseText;                

                showDynamicPopup('Finished generating article.','Finished generating article for topic: ' + topicInput + '. See the dataset dropdown under the Settings tab.', 3000);
                document.getElementById('gsv-topic-input').value='';
                selectElt.dispatchEvent(new Event('change', { bubbles: true }));
                document.getElementsByClassName("tab-btn")[0].click();

                return responseText;
            }
        } catch (error) {
          clearTimeout(timeoutId); // Ensure timer cleans up on error

          const isTimeout = error.name === 'AbortError';
          const warnMsg = `Attempt ${attempt} failed. Reason: ${isTimeout ? 'Timeout (15s exceeded)' : error.message}`;
          console.warn(warnMsg);
          showDynamicPopup('Warning.', warnMsg, 1500);
          // If we used all retries, throw the final error up to your application
          if (attempt === maxRetries) {
            const errMsg = `Gemini API completely failed after ${maxRetries} attempts.`;
            showDynamicPopup('Error', errMsg, 1500);
            throw new Error(errMsg);
          } else {
              showDynamicPopup('Warning', warnMsg, 1500);
          }
          // Wait before trying again (2s, then 4s, etc.)
          console.log(`Waiting ${currentDelay / 1000}s before next attempt...`);
          await new Promise(resolve => setTimeout(resolve, currentDelay));
          currentDelay *= 2; 
        }
    }

    return null;
}

function displayIncognitoWarning() {
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(estimate => {
        if (estimate.quota < 5000000000) {
          console.log("Likely Incognito Mode");
          showDynamicPopup('Warning','The page will not work well in Private / Incognito mode.', 5000);
        } 
      });
    }
}
