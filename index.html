<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=31536000">
    <title>Spanish ⇄ English Flashcards</title>
    <script src="sentences.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="viewer">
    <h2>Spanish ⇄ English Flashcards</h2>
        <div class="display-card">
            <div id="spanishText" class="spanish-text">Loading...</div>
            
            <div class="action-row">
                <button id="translateBtn" class="btn-translate">Show Translation</button>
            </div>
            
            <div id="englishText" class="english-text hidden"></div>
        </div>

        <div class="controls">
            <button id="prevBtn" class="btn-nav" disabled>← Previous</button>
            <button id="nextBtn" class="btn-nav">Next Random →</button>
        </div>

    </div>
</div>

<script>
    let dataset = [];
    let history = [];
    let historyIndex = -1;
    let currentItem = null;

    const spanishText = document.getElementById('spanishText');
    const englishText = document.getElementById('englishText');
    const statusIndicator = document.getElementById('statusIndicator');
    const translateBtn = document.getElementById('translateBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const statTotal = document.getElementById('statTotal');

    // Parse the embedded raw string automatically on load
    function initFlashcards() {
        dataset = [];
        history = [];
        historyIndex = -1;

        const lines = rawTsvData.split(/\r?\n/);

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            const columns = line.split('\t');
            if (columns.length >= 4) {
                const esId = columns[0].trim();
                dataset.push({ 
                    esId: esId,
                    spanish: columns[1].trim(),
                    enId: columns[2].trim(),
                    english: columns[3].trim()
                });
            }
        }

        if (dataset.length > 0) {
            showNextRandom();
        } else {
            alert("Embedded TSV data is empty or formatted incorrectly.");
        }

        document.getElementById('nextBtn').click();
    }

    function displayCard(item) {
        currentItem = item;
        
        spanishText.textContent = item.spanish;
        englishText.textContent = item.english;

        englishText.classList.add('hidden');
        translateBtn.classList.remove('hidden');
        
        prevBtn.disabled = (historyIndex <= 0);
    }

    function showNextRandom() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            displayCard(history[historyIndex]);
            return;
        }

        const randomIndex = Math.floor(Math.random() * dataset.length);
        const item = dataset[randomIndex];
        
        history.push(item);
        historyIndex++;
        
        displayCard(item);
    }

function showPrevious() {if (historyIndex > 0) {historyIndex--;displayCard(history[historyIndex]);}}translateBtn.addEventListener('click', function() {englishText.classList.remove('hidden');translateBtn.classList.add('hidden');});nextBtn.addEventListener('click', showNextRandom);prevBtn.addEventListener('click', showPrevious); 


initFlashcards();
</script>
</body>
</html>
