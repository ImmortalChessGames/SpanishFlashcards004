<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish-English Dictionary Cookie Saver</title>
    <!-- jQuery -->
    <script src="https://jquery.com"></script>
    <!-- JS Cookie library for cross-browser compatibility -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #5c67f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #4a54e1; }
        ul { list-style-type: none; padding: 0; }
        li { background: #eee; padding: 10px; margin-top: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background-color: #e60000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Spanish-English Dictionary</h2>
    
    <form id="wordForm">
        <label for="spanishWord">Spanish Word:</label>
        <input type="text" id="spanishWord" placeholder="e.g., gracias" required>
        
        <label for="englishTranslation">English Translation:</label>
        <input type="text" id="englishTranslation" placeholder="e.g., thank you" required>
        
        <button type="submit">Save Word</button>
    </form>

    <h3 style="margin-top: 30px;">Saved Translations</h3>
    <ul id="wordList"></ul>
</div>

<script>
    const COOKIE_NAME = 'saved_vocab';

    // 1. Function to retrieve words from the cookie
    function getVocabFromCookies() {
        const cookieData = Cookies.get(COOKIE_NAME);
        if (!cookieData) return [];
        try {
            return JSON.parse(cookieData);
        } catch (e) {
            return [];
        }
    }

    // 2. Function to render the list of words on the page
    function renderWordList() {
        const vocabList = getVocabFromCookies();
        const $wordList = $('#wordList');
        $wordList.empty();

        vocabList.forEach((item, index) => {
            $wordList.append(`
                <li>
                    <strong>${item.spanish}</strong> ➔ ${item.english}
                    <button class="delete-btn" data-index="${index}">Delete</button>
                </li>
            `);
        });
    }

    // 3. Form submission to save a new word
    $('#wordForm').on('submit', function(e) {
        e.preventDefault();

        const spanishVal = $('#spanishWord').val().trim();
        const englishVal = $('#englishTranslation').val().trim();

        if (spanishVal && englishVal) {
            const currentVocab = getVocabFromCookies();
            
            // Add new word pair
            currentVocab.push({ spanish: spanishVal, english: englishVal });

            // Cookies take strings, so we stringify our array of objects. 
            // Expires in 365 days.
            Cookies.set(COOKIE_NAME, JSON.stringify(currentVocab), { expires: 365 });

            // Reset form
            $('#wordForm')[0].reset();

            // Re-render list
            renderWordList();
        }
    });

    // 4. Event delegation to delete a word from the cookie
    $('#wordList').on('click', '.delete-btn', function() {
        const indexToRemove = $(this).data('index');
        const currentVocab = getVocabFromCookies();

        // Remove the specific item
        currentVocab.splice(indexToRemove, 1);

        // Update cookie
        if (currentVocab.length > 0) {
            Cookies.set(COOKIE_NAME, JSON.stringify(currentVocab), { expires: 365 });
        } else {
            Cookies.remove(COOKIE_NAME); // Remove cookie completely if empty
        }

        // Re-render list
        renderWordList();
    });

    // 5. Load existing words when the page opens
    $(document).ready(function() {
        renderWordList();
    });
</script>

</body>
</html>
