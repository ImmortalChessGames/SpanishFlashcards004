<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish-English Dictionary (High Capacity)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 10px; background-color: #5c67f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #4a54e1; }
        
        .search-box { background-color: #eef2ff; padding: 15px; border-radius: 6px; margin-top: 25px; border: 1px solid #dcdfe6; }
        .search-box label { margin-top: 0; color: #4a54e1; }
        
        ul { list-style-type: none; padding: 0; margin-top: 15px; }
        li { background: #f9f9fb; padding: 10px 15px; margin-top: 6px; border: 1px solid #eaeaea; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        li:hover { background: #f1f3f9; }
        
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; }
        .delete-btn:hover { background-color: #e60000; }
        
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; }
        .pagination button { width: auto; padding: 5px 15px; background-color: #f0f0f0; color: #333; font-size: 14px; }
        .pagination button:hover { background-color: #e0e0e0; }
        .pagination button:disabled { background-color: #fafafa; color: #ccc; cursor: not-allowed; }
        .page-info { font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Spanish-English Dictionary</h2>
    
    <!-- Input Form -->
    <form id="wordForm">
        <label for="spanishWord">Spanish Word:</label>
        <input type="text" id="spanishWord" placeholder="e.g., gracias" required>
        
        <label for="englishTranslation">English Translation:</label>
        <input type="text" id="englishTranslation" placeholder="e.g., thank you" required>
        
        <button type="submit">Save Word</button>
    </form>

    <!-- Search & Browse Section -->
    <div class="search-box">
        <label for="searchBar">🔍 Search & Browse Translations:</label>
        <input type="text" id="searchBar" placeholder="Type to filter Spanish or English words...">
        
        <ul id="wordList"></ul>

        <!-- Pagination Controls -->
        <div class="pagination">
            <button id="prevPage" disabled>Previous</button>
            <span class="page-info" id="pageInfo">Showing 0 of 0</span>
            <button id="nextPage" disabled>Next</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'saved_vocab';
    const ITEMS_PER_PAGE = 20;
    
    let currentPage = 1;
    let filteredList = []; // Holds items after search filter is applied

    const wordForm = document.getElementById('wordForm');
    const wordList = document.getElementById('wordList');
    const searchBar = document.getElementById('searchBar');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const pageInfo = document.getElementById('pageInfo');

    // 1. Retrieve items from localStorage
    function getVocabFromStorage() {
        const localData = localStorage.getItem(STORAGE_KEY);
        if (!localData) return [];
        try {
            return JSON.parse(localData);
        } catch (e) {
            return [];
        }
    }

    // 2. Sort array alphabetically by Spanish word
    function sortAlphabetically(array) {
        return array.sort((a, b) => a.spanish.localeCompare(b.spanish, 'es', { sensitivity: 'base' }));
    }

    // 3. Process data (Filter by search query, then paginate)
    function updateDisplayData() {
        const fullList = getVocabFromStorage();
        const searchQuery = searchBar.value.toLowerCase().trim();

        // Filter based on search input
        if (searchQuery) {
            filteredList = fullList.filter(item => 
                item.spanish.toLowerCase().includes(searchQuery) || 
                item.english.toLowerCase().includes(searchQuery)
            );
        } else {
            filteredList = fullList;
        }

        // Always keep the filtered results alphabetized
        sortAlphabetically(filteredList);

        // Determine total pages
        const totalItems = filteredList.length;
        const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

        // Adjust bounds for current page
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        // Paginate slice
        const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
        const endIndex = startIndex + ITEMS_PER_PAGE;
        const pageItems = filteredList.slice(startIndex, endIndex);

        // Render current page items
        wordList.innerHTML = '';
        if (pageItems.length === 0) {
            wordList.innerHTML = '<li style="color: #888; justify-content: center;">No words found</li>';
        } else {
            pageItems.forEach((item) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>${item.spanish}</strong> ➔ ${item.english}</span>
                    <button class="delete-btn" data-word="${item.spanish.replace(/"/g, '&quot;')}">Delete</button>
                `;
                wordList.appendChild(li);
            });
        }

        // Update pagination buttons and text
        pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${totalItems} total entries)`;
        prevPageBtn.disabled = currentPage === 1;
        nextPageBtn.disabled = currentPage === totalPages || totalItems === 0;
    }

    // 4. Save a new word
    wordForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const spanishVal = document.getElementById('spanishWord').value.trim();
        const englishVal = document.getElementById('englishTranslation').value.trim();

        if (spanishVal && englishVal) {
            let currentVocab = getVocabFromStorage();
            
            // Check if Spanish word already exists to avoid exact duplicates
            const exists = currentVocab.some(item => item.spanish.toLowerCase() === spanishVal.toLowerCase());
            if (exists) {
                alert(`"${spanishVal}" is already in your dictionary!`);
                return;
            }

            currentVocab.push({ spanish: spanishVal, english: englishVal });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(currentVocab));

            wordForm.reset();
            
            // Go to page 1 to let the user see where it fits alphabetically or search it
            currentPage = 1; 
            updateDisplayData();
        }
    });

    // 5. Delete an entry (Targeted by unique Spanish word instead of index due to sorting/pagination)
    wordList.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('delete-btn')) {
            const wordToDelete = e.target.getAttribute('data-word');
            let currentVocab = getVocabFromStorage();

            currentVocab = currentVocab.filter(item => item.spanish !== wordToDelete);

            if (currentVocab.length > 0) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(currentVocab));
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }

            updateDisplayData();
        }
    });

    // 6. Search input listener
    searchBar.addEventListener('input', function() {
        currentPage = 1; // Reset to first page when filtering
        updateDisplayData();
    });

    // 7. Pagination Button Listeners
    prevPageBtn.addEventListener('click', function() {
        if (currentPage > 1) {
            currentPage--;
            updateDisplayData();
        }
    });

    nextPageBtn.addEventListener('click', function() {
        const totalPages = Math.ceil(filteredList.length / ITEMS_PER_PAGE);
        if (currentPage < totalPages) {
            currentPage++;
            updateDisplayData();
        }
    });

    // 8. Initial Load
    document.addEventListener('DOMContentLoaded', function() {
        updateDisplayData();
    });
</script>

</body>
</html>
